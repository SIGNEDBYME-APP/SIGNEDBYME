name: Release

on:
  push:
    tags:
      - 'v*'

env:
  ZKEY_URL: https://signedby-assets.atl1.cdn.digitaloceanspaces.com/groth16/membership_final.zkey
  VK_URL: https://signedby-assets.atl1.cdn.digitaloceanspaces.com/groth16/verification_key_final.json

jobs:
  # Build native SDK bundles for each platform
  build-native:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            rapidsnark_target: host
          - target: macos-arm64
            os: macos-latest
            rapidsnark_target: macos_arm64
          - target: windows-x64
            os: windows-latest
            rapidsnark_target: windows_x64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgmp-dev nasm nlohmann-json3-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gmp nlohmann-json nasm cmake

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install cmake nasm -y

      - name: Setup MSBuild
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Build GMP (macOS only)
        if: runner.os == 'macOS'
        working-directory: native/rapidsnark
        run: |
          ./build_gmp.sh ${{ matrix.rapidsnark_target }}
          # For ARM64, also build x86_64 GMP for cross-compiling witness
          if [ "${{ matrix.target }}" = "macos-arm64" ]; then
            ./build_gmp.sh macos_x86_64
          fi

      - name: Install GMP via vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Clone and bootstrap vcpkg
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh
          
          # Install GMP for x64 Windows
          ./vcpkg/vcpkg install gmp:x64-windows
          
          # Copy to where rapidsnark expects them
          mkdir -p native/rapidsnark/depends/gmp/package/lib
          mkdir -p native/rapidsnark/depends/gmp/package/include
          cp vcpkg/installed/x64-windows/lib/gmp.lib native/rapidsnark/depends/gmp/package/lib/
          cp vcpkg/installed/x64-windows/include/gmp.h native/rapidsnark/depends/gmp/package/include/
          
          echo "=== Verify installation ==="
          ls -la native/rapidsnark/depends/gmp/package/lib/
          ls -la native/rapidsnark/depends/gmp/package/include/

      - name: Build rapidsnark
        if: runner.os != 'Windows'
        working-directory: native/rapidsnark
        run: |
          # Build with -DUSE_ASM=OFF for shared library compatibility (PIC)
          # Build only 'rapidsnark' target - skip tests and prover (static lib linking issues)
          # No 'make install' - collect step copies directly from build dir
          if [ "${{ matrix.target }}" = "linux-x64" ]; then
            rm -rf build_prover && mkdir build_prover && cd build_prover
            cmake .. -DCMAKE_BUILD_TYPE=Release -DUSE_ASM=OFF -DUSE_OPENMP=ON -DCMAKE_POSITION_INDEPENDENT_CODE=ON
            make -j$(nproc) rapidsnark
          elif [ "${{ matrix.target }}" = "macos-arm64" ]; then
            rm -rf build_prover_macos_arm64 && mkdir build_prover_macos_arm64 && cd build_prover_macos_arm64
            cmake .. -DTARGET_PLATFORM=macos_arm64 -DCMAKE_BUILD_TYPE=Release -DUSE_ASM=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON
            make -j$(sysctl -n hw.ncpu) rapidsnark
          fi

      - name: Build rapidsnark (Windows)
        if: runner.os == 'Windows'
        working-directory: native/rapidsnark
        shell: cmd
        run: |
          mkdir build_prover_windows
          cd build_prover_windows
          
          REM Configure with CMake first (creates src directory)
          cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DUSE_ASM=OFF -DGMP_PREFIX=..\depends\gmp\package -DGMP_INCLUDE_DIR=..\depends\gmp\package\include -DGMP_LIB_DIR=..\depends\gmp\package\lib
          
          REM Copy gmp.lib to src directory (where MSBuild linker runs from)
          copy ..\depends\gmp\package\lib\gmp.lib src\
          
          REM Now build
          cmake --build . --config Release --target rapidsnark

      - name: Build witness calculator
        if: runner.os != 'Windows'
        working-directory: circuits/build/membership_cpp
        timeout-minutes: 45
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            # macOS: need to tell compiler/linker where GMP is installed
            GMP_DIR="${{ github.workspace }}/native/rapidsnark/depends/gmp/package_${{ matrix.rapidsnark_target }}"
            export CPLUS_INCLUDE_PATH="${GMP_DIR}/include:${CPLUS_INCLUDE_PATH}"
            export LIBRARY_PATH="${GMP_DIR}/lib:${LIBRARY_PATH}"
            echo "GMP_DIR=${GMP_DIR}"
            
            # Use matrix.target, NOT uname -m (host may differ from target on Rosetta)
            if [ "${{ matrix.target }}" = "macos-arm64" ]; then
              echo "ARM64 TARGET - cross-compiling witness for x86_64 (runs via Rosetta)..."
              # Use x86_64 GMP for cross-compilation
              GMP_DIR="${{ github.workspace }}/native/rapidsnark/depends/gmp/package_macos_x86_64"
              export CPLUS_INCLUDE_PATH="${GMP_DIR}/include:${CPLUS_INCLUDE_PATH}"
              export LIBRARY_PATH="${GMP_DIR}/lib:${LIBRARY_PATH}"
              # Run make under Rosetta to use x86_64 toolchain
              arch -x86_64 make
              echo "Witness build complete (x86_64 binary for Rosetta)"
              file membership
              exit 0
            fi
            # x64 target - use standard Makefile with x86 assembly
            echo "x64 TARGET - using Makefile with assembly..."
          fi
          make
          echo "Witness build complete"

      - name: Build witness calculator (Windows)
        if: runner.os == 'Windows'
        working-directory: circuits/build/membership_cpp
        shell: bash
        run: |
          # Windows witness calculator - compile as executable
          # The Makefile uses g++, we need to adapt for MSVC or use mingw
          # For now, skip witness calculator on Windows (can be added later)
          echo "Witness calculator build skipped on Windows (TODO)"

      - name: Build signedby_sdk C FFI library
        working-directory: native/signedby_core
        run: |
          cargo build --release
          echo "signedby_sdk library built successfully"

      - name: Download zkey from CDN
        shell: bash
        run: |
          mkdir -p dist
          curl -L -o dist/membership_final.zkey ${{ env.ZKEY_URL }}
          curl -L -o dist/verification_key_final.json ${{ env.VK_URL }}

      - name: Collect artifacts
        shell: bash
        run: |
          # Copy native libraries
          if [ "${{ matrix.target }}" = "linux-x64" ]; then
            cp native/rapidsnark/package/lib/librapidsnark.so dist/ || cp native/rapidsnark/build_prover/src/librapidsnark.so dist/
            cp circuits/build/membership_cpp/libmembership_witness.so dist/ || cp circuits/build/membership_cpp/membership dist/membership_witness
            cp native/signedby_core/target/release/libsignedby_sdk.so dist/
          elif [ "${{ matrix.target }}" = "macos-arm64" ]; then
            cp native/rapidsnark/package_macos_arm64/lib/librapidsnark.dylib dist/ || cp native/rapidsnark/build_prover_macos_arm64/src/librapidsnark.dylib dist/
            cp circuits/build/membership_cpp/membership dist/membership_witness
            cp native/signedby_core/target/release/libsignedby_sdk.dylib dist/
          elif [ "${{ matrix.target }}" = "windows-x64" ]; then
            cp native/rapidsnark/build_prover_windows/src/Release/rapidsnark.dll dist/ || cp native/rapidsnark/build_prover_windows/Release/rapidsnark.dll dist/ || true
            cp native/signedby_core/target/release/signedby_sdk.dll dist/ || true
            # Witness calculator not built on Windows yet
          fi
          
          # Copy witness data
          cp circuits/build/membership_cpp/membership.dat dist/ || true
          
          # Create checksums
          cd dist
          sha256sum * > SHA256SUMS.txt || shasum -a 256 * > SHA256SUMS.txt

      - name: Create ZIP
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../signedby-sdk-${{ matrix.target }}-${{ github.ref_name }}.zip .
          else
            zip -r ../signedby-sdk-${{ matrix.target }}-${{ github.ref_name }}.zip .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: signedby-sdk-${{ matrix.target }}
          path: signedby-sdk-${{ matrix.target }}-${{ github.ref_name }}.zip

  # Create GitHub Release with all artifacts
  release:
    name: Create Release
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish SDK packages to registries
  publish-pypi:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install maturin
        run: pip install maturin

      - name: Build and publish
        working-directory: sdk/python
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: maturin publish
        continue-on-error: true  # Don't fail if version already exists

  publish-npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm install

      - name: Build
        working-directory: sdk/typescript
        run: npm run build

      - name: Publish
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
        continue-on-error: true  # Don't fail if version already exists

  publish-crates:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        working-directory: native/signedby_core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish
        continue-on-error: true  # Don't fail if version already exists
