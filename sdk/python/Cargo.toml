[package]
name = "signedby-python"
version = "1.0.0"
edition = "2021"
description = "Python bindings for SIGNEDBYME SDK"
license = "MIT"
repository = "https://github.com/SIGNEDBYME-APP/SIGNEDBYME"
homepage = "https://signedbyme.com"
documentation = "https://signedbyme.com/docs/sdk-quickstart"

[lib]
name = "signedby"
crate-type = ["cdylib"]

[dependencies]
# PyO3 for Python bindings (patched version)
pyo3 = { version = "0.24.1", features = ["extension-module"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Encoding
hex = "0.4"
bech32 = "0.11"
base64 = "0.22"
